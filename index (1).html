<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Boss House Control</title>
<style>
:root{--bg:#0a0612;--card:#150f26;--line:#32244f;--text:#f4eefc;--mute:#9b8bbd;--gold:#ffc23c;--red:#ff4d6d;--green:#3ddc97;--blue:#5ab0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;line-height:1.4;background:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(255,194,60,.28),transparent),radial-gradient(circle at 90% 90%,rgba(120,60,255,.22),transparent 50%),var(--bg)}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(10,6,18,.8);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.logo{width:48px;height:48px;filter:drop-shadow(0 0 10px rgba(255,194,60,.7))}
h1{margin:0;font-size:24px;letter-spacing:1px;color:var(--gold);text-shadow:0 0 18px rgba(255,194,60,.5)}
.sub{font-size:12px;color:var(--mute)}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:bold;font-size:13px;color:var(--red)}
.live i{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,109,.7)}100%{box-shadow:0 0 0 12px rgba(255,77,109,0)}}
@keyframes slide{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
#banner{display:none;margin:14px 14px 0;padding:14px 18px;background:linear-gradient(90deg,#ffc23c,#ff8a3c);color:#201400;font-weight:bold;border-radius:10px;font-size:18px;box-shadow:0 0 30px rgba(255,194,60,.45);animation:slide .5s}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;padding:16px}
section{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent),var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:16px;overflow-x:auto;box-shadow:0 8px 28px rgba(0,0,0,.4)}
section.wide{grid-column:1/-1}
section.danger{border-top-color:var(--red)}
h2{margin:0 0 12px;font-size:17px;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 5px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:normal;font-size:12px}
tr:hover td{background:rgba(255,255,255,.03)}
button{background:#2b2147;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px;transition:transform .12s,border-color .12s}
button:hover{border-color:var(--gold);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue)}
button.on{background:var(--gold);color:#201400;border-color:var(--gold)}
button.bad{border-color:var(--red);color:var(--red)}button.bad:hover{background:var(--red);color:#fff}
button.go{background:var(--green);color:#042;border-color:var(--green);font-weight:bold}
input,select{background:#0a0612;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;margin-left:5px;font-weight:bold}
.cap{background:var(--gold);color:#201400}.imm{background:var(--green);color:#052}.nom{background:var(--red);color:#fff}
.out{opacity:.4;filter:grayscale(1)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:12px;font-weight:bold;margin-right:7px;vertical-align:middle;border:2px solid rgba(255,255,255,.4);color:#fff}
.lb{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lb .rk{width:30px;text-align:center;font-size:20px}
.lb .nm{width:130px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:6px;background:#0a0612;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a3c);transition:width .6s}
.lb b{width:44px;text-align:right;color:var(--gold)}
.dz{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px;border:1px solid var(--red);border-radius:10px;background:rgba(255,77,109,.1);animation:glow 2s infinite alternate}
@keyframes glow{from{box-shadow:0 0 4px rgba(255,77,109,.3)}to{box-shadow:0 0 18px rgba(255,77,109,.7)}}
.empty{color:var(--mute);font-size:14px}
.ringbox{position:relative;width:150px;height:150px;margin:0 auto 12px}
.ringbox svg{transform:rotate(-90deg)}
#time{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:bold;color:var(--blue)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat div{background:#0a0612;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat em{font-style:normal;font-size:22px}
.stat b{display:block;font-size:18px;color:var(--gold);margin-top:2px}.stat span{font-size:12px;color:var(--mute)}
li{margin-bottom:8px}.done{text-decoration:line-through;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><svg class="logo" viewBox="0 0 64 64"><path d="M4 32C14 14 50 14 60 32 50 50 14 50 4 32Z" fill="none" stroke="#ffc23c" stroke-width="4"/><circle cx="32" cy="32" r="11" fill="#ffc23c"/><circle cx="32" cy="32" r="5" fill="#0a0612"/></svg><div><h1>BIG BOSS HOUSE</h1><div class="sub">Control room, Round 1</div></div><div class="live"><i></i>LIVE</div></header>
<div id="banner"></div>
<main id="app"></main>
<script>
const SEED=[["Aarav","Team Alpha"],["Diya","Team Alpha"],["Kabir","Team Beta"],["Meera","Team Beta"],["Rohan","Team Gamma"],["Sana","Team Gamma"],["Vikram","Team Delta"],["Zoya","Team Delta"]];
let S;
try{S=JSON.parse(localStorage.getItem("bb"))}catch(e){}
if(!S)S={n:9,ppl:SEED.map((d,i)=>({id:i+1,name:d[0],team:d[1],pts:0,out:false,cap:false,nom:false,imm:false})),tasks:[],tn:1,ann:"",log:[],left:2700,run:false};
const save=()=>{try{localStorage.setItem("bb",JSON.stringify(S))}catch(e){}};
const P=id=>S.ppl.find(p=>p.id===id);
const live=()=>S.ppl.filter(p=>!p.out);
const act=fn=>{fn();save();render()};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function addP(){const n=document.getElementById("nn").value.trim(),t=document.getElementById("nt").value.trim()||"No team";if(!n)return;act(()=>S.ppl.push({id:S.n++,name:n,team:t,pts:0,out:false,cap:false,nom:false,imm:false}))}
function pts(id,d){act(()=>P(id).pts+=d)}
function setCap(id){act(()=>S.ppl.forEach(p=>p.cap=p.id===id&&!p.cap))}
function nominate(id){const p=P(id);if(p.imm){alert(p.name+" has immunity and cannot be nominated.");return}act(()=>p.nom=!p.nom)}
function immune(id){act(()=>{const p=P(id);p.imm=!p.imm;if(p.imm)p.nom=false})}
function evict(id){const p=P(id);if(!confirm("Evict "+p.name+"?"))return;act(()=>{p.out=true;p.cap=p.nom=p.imm=false})}
function addTask(){const w=+document.getElementById("tw").value,t=document.getElementById("tt").value.trim();if(!w||!t)return;act(()=>S.tasks.push({id:S.tn++,who:w,text:t,done:false}))}
function doneTask(id){act(()=>{const t=S.tasks.find(x=>x.id===id);t.done=!t.done})}
function announce(){const t=document.getElementById("an").value.trim();if(!t)return;act(()=>{S.ann=t;S.log.unshift(t)})}
function clearAnn(){act(()=>S.ann="")}
function tStart(){act(()=>S.run=S.left>0)}
function tPause(){act(()=>S.run=false)}
function tReset(){act(()=>{S.run=false;S.left=2700})}
setInterval(()=>{if(S.run){S.left--;if(S.left<=0){S.left=0;S.run=false}save();const e=document.getElementById("time");if(e)e.textContent=fmt(S.left);const r=document.getElementById("ring");if(r)r.style.strokeDashoffset=339.3*(1-S.left/2700)}},1000);

const hue=t=>[...t].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const av=p=>`<span class="av" style="background:hsl(${hue(p.team)},60%,42%)">${esc(p.name.slice(0,2).toUpperCase())}</span>`;
function render(){
const L=live(),rank=[...L].sort((a,b)=>b.pts-a.pts),nom=L.filter(p=>p.nom);
const done=S.tasks.filter(t=>t.done).length,top=rank[0],low=rank[rank.length-1],cap=L.find(p=>p.cap);
const b=document.getElementById("banner");b.style.display=S.ann?"block":"none";b.innerHTML=S.ann?"Big Boss says: "+esc(S.ann):"";
document.getElementById("app").innerHTML=`
<section class="wide"><h2>Contestants</h2>
<div class="row"><input id="nn" placeholder="Name"><input id="nt" placeholder="Team"><button onclick="addP()">Add contestant</button></div>
<table><tr><th>Name</th><th>Team</th><th>Points</th><th>Status</th><th>Actions</th></tr>
${S.ppl.map(p=>`<tr class="${p.out?"out":""}"><td>${av(p)}${esc(p.name)}${p.cap?'<span class="tag cap">Captain</span>':""}</td><td>${esc(p.team)}</td><td>${p.pts}</td>
<td>${p.out?"Evicted":"Active"}${p.imm?'<span class="tag imm">Immune</span>':""}${p.nom?'<span class="tag nom">Nominated</span>':""}</td>
<td>${p.out?"":`<button onclick="pts(${p.id},10)">+10</button> <button onclick="pts(${p.id},-10)">-10</button>
<button class="${p.cap?"on":""}" onclick="setCap(${p.id})">Captain</button>
<button class="${p.nom?"on":""}" onclick="nominate(${p.id})">Nominate</button>
<button class="${p.imm?"on":""}" onclick="immune(${p.id})">Immunity</button>
<button class="bad" onclick="evict(${p.id})">Evict</button>`}</td></tr>`).join("")}</table></section>

<section><h2>Live leaderboard</h2>
${rank.map((p,i)=>`<div class="lb"><span class="rk">${["🥇","🥈","🥉"][i]||i+1}</span>${av(p)}<span class="nm">${esc(p.name)}</span><div class="bar"><i style="width:${Math.max(4,Math.round(Math.max(p.pts,0)/Math.max(...rank.map(x=>x.pts),10)*100))}%"></i></div><b>${p.pts}</b></div>`).join("")||"<p class='empty'>No active contestants.</p>"}</section>

<section class="danger"><h2>Danger zone</h2>${nom.map(p=>`<div class="dz">${av(p)}<div><b>${esc(p.name)}</b><br><small>${esc(p.team)}</small></div><span class="tag nom" style="margin-left:auto">NOMINATED</span></div>`).join("")||"<p class='empty'>Nobody is nominated. The house is safe.</p>"}</section>

<section><h2>Tasks</h2><div class="row"><select id="tw">${L.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><input id="tt" placeholder="Task"><button onclick="addTask()">Assign task</button></div>
<ul>${S.tasks.map(t=>`<li class="${t.done?"done":""}">${esc(P(t.who).name)}: ${esc(t.text)} <button onclick="doneTask(${t.id})">${t.done?"Undo":"Mark complete"}</button></li>`).join("")||"<li style='color:var(--mute)'>No tasks yet.</li>"}</ul></section>

<section><h2>Task timer</h2><div class="ringbox"><svg width="150" height="150"><circle cx="75" cy="75" r="54" fill="none" stroke="#32244f" stroke-width="10"/><circle id="ring" cx="75" cy="75" r="54" fill="none" stroke="#5ab0ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.3" style="stroke-dashoffset:${339.3*(1-S.left/2700)};transition:stroke-dashoffset 1s linear"/></svg><div id="time">${fmt(S.left)}</div></div><div class="row" style="justify-content:center"><button class="go" onclick="tStart()">Start</button><button onclick="tPause()">Pause</button><button class="bad" onclick="tReset()">Reset</button></div></section>

<section><h2>Big Boss announcement</h2><div class="row"><input id="an" placeholder="Type an announcement" style="flex:1"><button onclick="announce()">Announce</button><button onclick="clearAnn()">Clear</button></div>
<ul>${S.log.slice(0,5).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>

<section class="wide"><h2>House statistics</h2><div class="stat">
<div><em>🏆</em><b>${top?esc(top.name)+" ("+top.pts+")":"-"}</b><span>Highest scorer</span></div>
<div><em>📉</em><b>${low?esc(low.name)+" ("+low.pts+")":"-"}</b><span>Lowest scorer</span></div>
<div><em>✅</em><b>${done}/${S.tasks.length}</b><span>Completed tasks</span></div>
<div><em>⚠️</em><b>${nom.length}</b><span>Nominees</span></div>
<div><em>🛡️</em><b>${L.filter(p=>p.imm).length}</b><span>Immune</span></div>
<div><em>👑</em><b>${cap?esc(cap.name):"None"}</b><span>House captain</span></div>
<div><em>🏠</em><b>${L.length}</b><span>In the house</span></div>
<div><em>🚪</em><b>${S.ppl.length-L.length}</b><span>Evicted</span></div></div></section>`;
}
render();
</script></body></html>
